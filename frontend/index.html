<!DOCTYPE html>
<html>
<head>
    <title>Smart City Traffic Dashboard</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #0d1117; color: white; }
        .card { background: #161b22; padding:20px; border-radius:10px; margin-bottom:20px; }
        iframe { width:100%; height:400px; border:0; }
        h2 { color:#58a6ff; }
    </style>
</head>
<body>

<h1>🚦 Smart City Traffic Monitoring Dashboard</h1>

<div class="card">
    <h2>Live Traffic (Grafana)</h2>

</div>

<div class="card">
    <h2>Real-Time Spark Streaming Output</h2>
    <iframe src="http://localhost:4040"></iframe>
</div>

<div class="card">
    <h2>Kafka Messages (Kafdrop)</h2>
    <iframe src="http://localhost:9000"></iframe>
</div>

</html>
